<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaseStaffing</title><meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif;color:#16324F;background:#F7F4EE}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
p{text-align:center;margin-top:40vh}a{color:#1F8A85}</style></head>
<body><p id="msg">Moving to <a id="go" href="https://casestaffing.com/">casestaffing.com</a>…</p>
<script>
/* This old Staffing Map address now points to CaseStaffing.
   Normal visits: redirect (tagged ref=gh so visits from here can be counted).
   Opened by the old "Staffing Map Export" HHAx bookmark (?from=hhax): show CaseStaffing in a full-page frame
   and pass the bookmark's messages through, so the old bookmark keeps working. Nothing goes through a server. */
(function(){
 var CS='https://casestaffing.com',HHAX=['https://reports.hhaexchange.com','https://app.hhaexchange.com'];
 var q=new URLSearchParams(location.search),hash=location.hash||'';
 if(q.get('from')!=='hhax'||!window.opener){
  var u=CS+'/?ref=gh'+hash;document.getElementById('go').href=u;location.replace(u);return}
 document.getElementById('msg').remove();
 var f=document.createElement('iframe');f.src=CS+'/?from=hhax&via=gh&ref=gh'+hash;f.allow='geolocation; clipboard-write';document.body.appendChild(f);
 window.addEventListener('message',function(e){
  if(!e.data||e.data.app!=='staffing-map-export')return;
  if(e.source===window.opener&&HHAX.indexOf(e.origin)>=0){f.contentWindow.postMessage(e.data,CS)}
  else if(e.source===f.contentWindow&&e.origin===CS){HHAX.forEach(function(o){try{window.opener.postMessage(e.data,o)}catch(_){}})}
 });
})();
</script></body></html>
